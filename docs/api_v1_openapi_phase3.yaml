components:
  schemas:
    ApiTokenSummaryModel:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        token_prefix:
          type: string
          title: Token Prefix
        created_at:
          type: string
          title: Created At
        last_used_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Used At
        expires_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Expires At
      type: object
      required:
      - id
      - name
      - token_prefix
      - created_at
      - last_used_at
      - expires_at
      title: ApiTokenSummaryModel
    ContactCreateRequest:
      properties:
        name:
          type: string
          title: Name
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
        street:
          anyOf:
          - type: string
          - type: 'null'
          title: Street
        city:
          anyOf:
          - type: string
          - type: 'null'
          title: City
        zip:
          anyOf:
          - type: string
          - type: 'null'
          title: Zip
        country:
          anyOf:
          - type: string
          - type: 'null'
          title: Country
        ico:
          anyOf:
          - type: string
          - type: 'null'
          title: Ico
        dic:
          anyOf:
          - type: string
          - type: 'null'
          title: Dic
        fixed_variable_symbol:
          anyOf:
          - type: string
          - type: 'null'
          title: Fixed Variable Symbol
      additionalProperties: false
      type: object
      required:
      - name
      title: ContactCreateRequest
    ContactListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ContactModel'
          type: array
          title: Items
        page:
          type: integer
          title: Page
        per_page:
          type: integer
          title: Per Page
        total_items:
          type: integer
          title: Total Items
        total_pages:
          type: integer
          title: Total Pages
      type: object
      required:
      - items
      - page
      - per_page
      - total_items
      - total_pages
      title: ContactListResponse
    ContactModel:
      properties:
        id:
          type: integer
          title: Id
        subject_id:
          type: integer
          title: Subject Id
        name:
          type: string
          title: Name
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
        street:
          anyOf:
          - type: string
          - type: 'null'
          title: Street
        city:
          anyOf:
          - type: string
          - type: 'null'
          title: City
        zip:
          anyOf:
          - type: string
          - type: 'null'
          title: Zip
        country:
          anyOf:
          - type: string
          - type: 'null'
          title: Country
        ico:
          anyOf:
          - type: string
          - type: 'null'
          title: Ico
        dic:
          anyOf:
          - type: string
          - type: 'null'
          title: Dic
        fixed_variable_symbol:
          anyOf:
          - type: string
          - type: 'null'
          title: Fixed Variable Symbol
        external_source:
          anyOf:
          - type: string
          - type: 'null'
          title: External Source
        external_id:
          anyOf:
          - type: string
          - type: 'null'
          title: External Id
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
      type: object
      required:
      - id
      - subject_id
      - name
      - email
      - phone
      - street
      - city
      - zip
      - country
      - ico
      - dic
      - fixed_variable_symbol
      - external_source
      - external_id
      - created_at
      - updated_at
